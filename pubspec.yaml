name: saksham_app
description: Sri Krishnashraya Educational Trust NGO Management App
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  google_fonts: ^6.2.1
  excel: ^4.0.6
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  video_player: ^2.9.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
